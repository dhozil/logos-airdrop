[package]
name = "airdrop-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
bincode = "1"
rand = "0.8"

[[bin]]
name = "airdrop-cli"
path = "src/bin/cli.rs"
