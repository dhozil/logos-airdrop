[package]
name = "airdrop-program"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
bincode = { version = "1", default-features = false }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
