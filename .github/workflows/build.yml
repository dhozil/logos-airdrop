name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run SDK tests
        run: cargo test --manifest-path sdk/Cargo.toml --release
      - name: Build CLI
        run: cargo build --manifest-path sdk/Cargo.toml --release --bin airdrop-cli

  build-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LEZ airdrop guest via Docker
        working-directory: programs/airdrop
        run: |
          cat > Dockerfile.build << 'DEOF'
          FROM risczero/risc0-guest-builder:r0.1.88.0 AS build
          WORKDIR /src
          COPY . .
          RUN cargo +risc0 fetch --locked --target riscv32im-risc0-zkvm-elf
          RUN cargo +risc0 build --release --locked --target riscv32im-risc0-zkvm-elf

          FROM scratch AS export
          COPY --from=build /src/target/riscv32im-risc0-zkvm-elf/release/airdrop-program /airdrop-program.elf
          DEOF
          docker build -f Dockerfile.build -t airdrop-builder .
      - name: Export binary from Docker
        working-directory: programs/airdrop
        run: |
          docker create --name airdrop-export airdrop-builder
          mkdir -p target/risc0-guest
          docker cp airdrop-export:/airdrop-program.elf target/risc0-guest/airdrop-program.elf
          docker rm airdrop-export
      - name: Upload program ELF
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-program
          path: programs/airdrop/target/risc0-guest/airdrop-program.elf
