name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run SDK tests
        run: cargo test --manifest-path sdk/Cargo.toml --release
      - name: Build CLI
        run: cargo build --manifest-path sdk/Cargo.toml --release --bin airdrop-cli

  build-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Risc0
        run: |
          curl -fsSL https://risczero.com/install | bash
          export PATH="$HOME/.cargo/bin:$HOME/.risc0/bin:$PATH"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.risc0/bin" >> $GITHUB_PATH
      - name: Install cargo-risczero
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero 2>&1 || true
          which cargo-risczero || echo "cargo-risczero not in PATH"
          cargo risczero --version || echo "cargo risczero not available yet"
      - name: Build LEZ guest
        working-directory: programs/airdrop
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.risc0/bin:$HOME/.local/share/risc0/bin:$PATH"
          cargo risczero build --release
      - name: Upload program binary
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-program
          path: |
            programs/airdrop/target/risc0-guest/*.bin
            programs/airdrop/target/riscv32im-risc0-zkvm-elf/docker/*.bin
